version: "3.3"
services:
  app:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: adameds-setting
    ports:
      - 8082:8082
    restart: always
    networks:
      - adameds-network
    environment:
      DB_NAME: ${DB_NAME}
      DB_HOST: ${DB_HOST}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DIALECT: ${DB_DIALECT}
      BASE_URL: ${BASE_URL}

      # API CONFIG
      API_BASE: "api"
      API_VERSION: "v3"
networks:
  adameds-network:
    driver: bridge

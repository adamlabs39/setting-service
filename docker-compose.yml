services:
  adaneds-setting:
    build:
      context: ./
      dockerfile: Dockerfile
      no_cache: true
    container_name: adameds-setting-dev
    image: adameds/setting-service:dev
    ports:
      - 8082:8082
    restart: always
    networks:
      - adameds-network
    environment:
      DOTENV_KEY: ${DOTENV_KEY}
      # API CONFIG
      API_BASE: "api"
      API_VERSION: "v3"
    volumes:
      - type: bind
        source: /home/admin/adameds/public.key
        target: /adameds-setting/public.key
      - type: bind
        source: /home/admin/adameds/private.key
        target: /adameds-setting/private.key
      - type: bind
        source: /home/admin/adameds/.env.vault
        target: /adameds-setting/.env.vault
networks:
  adameds-network:
    driver: bridge
